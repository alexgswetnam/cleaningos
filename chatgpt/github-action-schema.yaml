openapi: 3.1.0
info:
  title: LLM Wiki — GitHub Vault Access
  description: >
    Read and write markdown files in a single GitHub repository that holds an
    Obsidian vault. Used by a custom GPT to browse sources, read wiki pages,
    capture notes to the inbox, and update wiki pages.
  version: 1.0.0

servers:
  - url: https://api.github.com

paths:
  /repos/{owner}/{repo}/contents/{path}:
    get:
      operationId: readPath
      summary: Read a file or list a directory
      description: >
        If path is a directory, returns an array of entries (use this to browse).
        If path is a file, returns a single object whose "content" field is
        base64-encoded and whose "sha" field is REQUIRED for any later update to
        that file. Always call this before writeFile on an existing file.
      parameters:
        - name: owner
          in: path
          required: true
          description: GitHub username or organization that owns the repo.
          schema:
            type: string
        - name: repo
          in: path
          required: true
          description: Repository name.
          schema:
            type: string
        - name: path
          in: path
          required: true
          description: >
            Path within the repo, e.g. "wiki/concepts" or
            "wiki/concepts/Compounding Knowledge.md". Use an empty string for the
            repository root.
          schema:
            type: string
        - name: ref
          in: query
          required: false
          description: Branch name. Omit to use the default branch.
          schema:
            type: string
      responses:
        "200":
          description: >
            If path is a file, a single object with base64 "content" and a "sha".
            If path is a directory, an array of entries each having name, path,
            type, and sha.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Path does not exist. For writeFile, this means omit sha.

    put:
      operationId: writeFile
      summary: Create or update a file
      description: >
        Creates a file if it does not exist, or updates it if it does.
        CRITICAL RULES:
        (1) The "content" field must be BASE64-ENCODED, not plain text.
        (2) When updating an existing file you MUST include its current "sha",
        obtained from readPath. Omitting sha on an existing file returns 409.
        (3) When creating a new file, omit sha entirely.
        This call replaces the ENTIRE file — to change one line, read the file,
        decode it, modify the full text, re-encode, and send the whole thing back.
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: path
          required: true
          description: Full path of the file to write, including the .md extension.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
                - content
              properties:
                message:
                  type: string
                  description: >
                    Commit message. Be descriptive, e.g.
                    "wiki: add concept page for Externalization".
                content:
                  type: string
                  description: >
                    The new file contents, BASE64-ENCODED. Never send plain text
                    here — the API will store it literally and corrupt the file.
                sha:
                  type: string
                  description: >
                    Blob SHA of the file being replaced. REQUIRED when updating an
                    existing file. Omit when creating a new file.
                branch:
                  type: string
                  description: Branch to commit to. Omit for the default branch.
      responses:
        "200":
          description: File updated.
        "201":
          description: File created.
        "409":
          description: >
            SHA conflict — the file exists and the sha was missing or stale.
            Call readPath again for the current sha and retry.
        "422":
          description: Invalid request, usually malformed base64 content.

  /search/code:
    get:
      operationId: searchVault
      summary: Search file contents across the vault
      description: >
        Full-text search within the repository. Always append " repo:OWNER/REPO"
        to the query to scope it. Note that GitHub code search indexes with a
        delay, so very recently written files may not appear yet — use readPath to
        browse directories when you need certainty.
      parameters:
        - name: q
          in: query
          required: true
          description: >
            Search query including the repo qualifier, e.g.
            "compounding repo:alexgswetnam/my-wiki" or
            "extension:md path:wiki/concepts repo:alexgswetnam/my-wiki".
          schema:
            type: string
        - name: per_page
          in: query
          required: false
          description: Results per page, max 100.
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Search results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_count:
                    type: integer
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        path:
                          type: string
                        html_url:
                          type: string

  /repos/{owner}/{repo}/commits:
    get:
      operationId: recentChanges
      summary: List recent commits
      description: >
        Shows what changed in the vault recently and who changed it. Useful for
        answering "what did I add this week" or checking whether the other agent
        has modified pages since you last read them.
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: false
          description: Limit to commits touching this file or directory.
          schema:
            type: string
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of commits.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    sha:
                      type: string
                    html_url:
                      type: string
                    commit:
                      type: object
                      properties:
                        message:
                          type: string

components:
  schemas:
    FileContent:
      type: object
      properties:
        type:
          type: string
        name:
          type: string
        path:
          type: string
        sha:
          type: string
          description: Blob SHA — required when updating this file.
        size:
          type: integer
        content:
          type: string
          description: Base64-encoded file contents. Decode before reading.
        encoding:
          type: string
        html_url:
          type: string

    DirectoryEntry:
      type: object
      properties:
        type:
          type: string
          description: Either "file" or "dir".
        name:
          type: string
        path:
          type: string
        sha:
          type: string
        size:
          type: integer
